[test_servers]
test-01 ansible_host=test-01 ansible_user=ansible
test-02 ansible_host=test-01 ansible_user=ansible
test-03 ansible_host=test-01 ansible_user=ansible

[test_servers:vars]
ansible_connection=ssh
ansible_ssh_private_key_file=/root/.ssh/id_ed25519
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_common_args='-o StrictHostKeyChecking=no'